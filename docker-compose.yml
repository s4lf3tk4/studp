# Общий каркас php-контейнеров: один образ на app/queue/migrate
x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: studpechat-php:local
  working_dir: /var/www
  environment:
    COMPOSER_HOME: /composer-global
  env_file:
    - .env
  volumes:
    - ./php-producer:/var/www
    - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
  networks:
    - studpechat

services:
  # Одноразовый контейнер: зависимости, схема БД, справочник корпусов.
  # Запускается при каждом `docker compose up`, отрабатывает и выходит.
  migrate:
    <<: *php
    container_name: studpechat-migrate
    user: "1000:1000"
    restart: "no"
    command: >
      sh -c "if [ ! -f vendor/autoload.php ]; then
               composer install --no-interaction --prefer-dist --optimize-autoloader;
             fi &&
             php artisan migrate --force --isolated &&
             php artisan db:seed --class=CampusScheduleSeeder --force"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  app:
    <<: *php
    container_name: studpechat-app
    restart: unless-stopped
    # volumes перечисляем полностью: YAML-слияние не склеивает списки, а заменяет
    volumes:
      - ./php-producer:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./data/documents:/var/www/storage/app/private/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  queue:
    <<: *php
    container_name: studpechat-queue
    user: "1000:1000"
    restart: unless-stopped
    command: sh -c "while true; do php artisan queue:work --tries=2 --timeout=280 --max-jobs=10 --memory=384; sleep 1; done"
    volumes:
      - ./php-producer:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./data/documents:/var/www/storage/app/private/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  webserver:
    image: nginx:alpine
    container_name: studpechat-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./php-producer:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - studpechat
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: studpechat-db
    restart: unless-stopped
    environment:
      # значения по умолчанию, чтобы up не падал при отсутствии .env
      MYSQL_DATABASE: ${DB_DATABASE:-studpechat}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    ports:
      - "127.0.0.1:3307:3306"   # наружу не торчит, с хоста доступен
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - studpechat
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: studpechat-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - studpechat
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  studpechat:
    driver: bridge

volumes:
  db-data:
  redis-data: