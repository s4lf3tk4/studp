# Общий каркас php-контейнеров: один образ на app/queue/migrate
x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: studpechat-php:local
  working_dir: /var/www
  environment:
    COMPOSER_HOME: /composer-global
  env_file:
    - .env
  volumes:
    - ./php-producer:/var/www
    - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
  networks:
    - studpechat

services:
  # Одноразовый контейнер: зависимости, схема БД, справочник корпусов.
  # Запускается при каждом `docker compose up`, отрабатывает и выходит.
  migrate:
    <<: *php
    container_name: studpechat-migrate
    user: "1000:1000"
    restart: "no"
    command: >
      sh -c "if [ ! -f vendor/autoload.php ]; then
               composer install --no-interaction --prefer-dist --optimize-autoloader;
             fi &&
             php artisan migrate --force --isolated"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  app:
    <<: *php
    restart: unless-stopped
    volumes:
      - ./php-producer:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/php/zz-www.conf:/usr/local/etc/php-fpm.d/zz-www.conf
      - ./data/documents:/var/www/storage/app/private/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  queue:
    <<: *php
    user: "1000:1000"
    restart: unless-stopped
    deploy:
      replicas: 4
    command: sh -c "while true; do php artisan queue:work --tries=2 --timeout=280 --max-jobs=200 --sleep=1 --memory=384; sleep 1; done"
    volumes:
      - ./php-producer:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./data/documents:/var/www/storage/app/private/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  webserver:
    image: nginx:alpine
    container_name: studpechat-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./php-producer:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - studpechat
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8.0
    container_name: studpechat-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is not set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set in .env}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is not set in .env}
      
    ports:
      - "127.0.0.1:3307:3306"   # наружу не торчит, с хоста доступен
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - studpechat
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: studpechat-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - studpechat
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  scheduler:
    <<: *php
    container_name: studpechat-scheduler
    user: "1000:1000"
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./php-producer:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./data/documents:/var/www/storage/app/private/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
  

    # Разовая сборка панели: пакеты ставятся в том, на хосте ничего не нужно
  admin-build:
    image: node:22-alpine
    profiles: ["admin"]
    working_dir: /work/admin
    volumes:
      - ./admin:/work/admin
      - ./php-producer/public:/work/php-producer/public
      - admin-node-modules:/work/admin/node_modules
      - admin-npm-cache:/root/.npm
    # npm ci ставит ровно то, что записано в package-lock.json,
    # и сам очищает node_modules перед установкой
    command: sh -c "npm ci && npm run build"

  # Dev-сервер с горячей перезагрузкой — по желанию, для правок панели
  admin-dev:
    image: node:22-alpine
    profiles: ["admin"]
    working_dir: /work/admin
    environment:
      ADMIN_API_TARGET: http://webserver
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./admin:/work/admin
      - ./php-producer/public:/work/php-producer/public
      - admin-node-modules:/work/admin/node_modules
      - admin-npm-cache:/root/.npm
    networks:
      - studpechat
    # Ставим зависимости только если том ещё пустой: иначе каждый up переустанавливал бы пакеты
    command: sh -c "test -f node_modules/.package-lock.json || npm ci; npm run dev"
    depends_on:
      - webserver

networks:
  studpechat:
    driver: bridge

volumes:
  db-data:
  redis-data:
  admin-node-modules:
  admin-npm-cache: